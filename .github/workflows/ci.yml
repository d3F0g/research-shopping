name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: fieldnote_fixture
          POSTGRES_USER: fieldnote_fixture
          POSTGRES_PASSWORD: fixture-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fieldnote_fixture -d fieldnote_fixture"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      EXA_RESEARCH_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install with npm 11
        run: npx --yes npm@11.6.2 ci
      - run: npm run typecheck
      - run: node scripts/verify-official-components.mjs
      - run: npm test
      - name: Verify account transactions and isolation
        run: npm run test:postgres
        env:
          FIELDNOTE_TEST_DATABASE_URL: postgresql://fieldnote_fixture:fixture-only-password@127.0.0.1:5432/fieldnote_fixture
      - name: Verify actual API and database restart recovery
        run: node scripts/verify-personalization-restart.mjs
        env:
          FIELDNOTE_TEST_DATABASE_URL: postgresql://fieldnote_fixture:fixture-only-password@127.0.0.1:5432/fieldnote_fixture
          FIELDNOTE_TEST_POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
      - run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify crash recovery without redispatch
        run: node scripts/verify-personalization-crash.mjs
        env:
          FIELDNOTE_TEST_DATABASE_URL: postgresql://fieldnote_fixture:fixture-only-password@127.0.0.1:5432/fieldnote_fixture
      - name: Verify actual account browser journeys
        run: node scripts/verify-personalization-browser.mjs
        env:
          FIELDNOTE_TEST_DATABASE_URL: postgresql://fieldnote_fixture:fixture-only-password@127.0.0.1:5432/fieldnote_fixture
      - run: npm run test:e2e
        env:
          DEBUG: pw:webserver
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: research-shopping-browser-evidence
          path: |
            artifacts/screenshots/
            artifacts/chat-first/application/
            artifacts/playwright-results/
            artifacts/fieldnote-v2/
            artifacts/verification-skill/
          if-no-files-found: ignore
